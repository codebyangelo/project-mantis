name: Python Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Tests
      env:
        PYTHONPATH: src
      run: |
        python -m unittest discover tests
